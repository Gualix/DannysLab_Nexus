worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;

  # Gzip — the Node app already serves brotli/gzip for static assets,
  # but enable here for any uncompressed proxy responses.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Trust container network; pass real client info upstream.
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  proxy_connect_timeout 10s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # WebSocket upgrade map
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Upstream Node SSR app on the compose network.
  upstream app_upstream {
    server app:3000;
    keepalive 32;
  }

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Health endpoint for the proxy itself.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Static assets emitted by Vite — long cache.
    location /assets/ {
      proxy_pass http://app_upstream;
      proxy_cache_bypass $http_upgrade;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Everything else → Node SSR.
    location / {
      proxy_pass http://app_upstream;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
